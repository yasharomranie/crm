<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>گنجنامه — بدون اتصال</title>
    <style>
        :root {
            --orange: #f97316;
            --green: #15803d;
            --ink: #1c1917;
            --paper: #fff7ed;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem 1.5rem;
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background: var(--paper);
            color: var(--ink);
            text-align: center;
        }

        .badge {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--orange), var(--green));
        }

        h1 {
            font-size: 1.15rem;
            margin: 0;
        }

        p {
            margin: 0;
            color: #78716c;
            font-size: .9rem;
            max-width: 26rem;
        }

        button {
            margin-top: .5rem;
            border: none;
            background: var(--orange);
            color: #fff;
            font-family: inherit;
            font-size: .9rem;
            font-weight: 700;
            padding: .7rem 1.5rem;
            border-radius: .75rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="badge"></div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>به نظر می‌رسد اتصال شما قطع شده. هر وقت دوباره وصل شدید، این صفحه را تازه کنید.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
</body>
</html>
