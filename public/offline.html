<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>آفلاین هستید — FarsiWP</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            background: #fffbeb;
            font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
            color: #1c1917;
            text-align: center;
        }

        .card {
            max-width: 26rem;
        }

        .mascot {
            width: 88px;
            height: 88px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: linear-gradient(155deg, #fde68a 0%, #f59e0b 55%, #d97706 100%);
            position: relative;
        }

        .mascot::before,
        .mascot::after {
            content: '';
            position: absolute;
            top: -6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(155deg, #fde68a, #f59e0b);
        }

        .mascot::before { inset-inline-start: 2px; }
        .mascot::after { inset-inline-end: 2px; }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 .5rem;
        }

        p {
            font-size: .9rem;
            line-height: 1.8;
            color: #57534e;
            margin: 0 0 1.5rem;
        }

        button {
            font-family: inherit;
            font-size: .9rem;
            font-weight: 600;
            color: #fff;
            background: #f59e0b;
            border: none;
            border-radius: .6rem;
            padding: .65rem 1.5rem;
            cursor: pointer;
        }

        @media (prefers-color-scheme: dark) {
            body { background: #1c1917; color: #f5f5f4; }
            p { color: #a8a29e; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mascot" aria-hidden="true"></div>
        <h1>الان آفلاین هستید</h1>
        <p>به اینترنت وصل نیستید. وقتی دوباره وصل شدید همه‌چیز مثل قبل کار می‌کنه.</p>
        <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </div>
</body>
</html>
